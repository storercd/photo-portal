<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Photos</title>
  <script>
    // Redirect the home page (and legacy ?c=<slug> links) to /galleries.
    const q = new URLSearchParams(location.search);
    const c = q.get("c");
    q.delete("c");
    const rest = q.size ? `?${q}` : "";
    location.replace(`/galleries${c ? `/${encodeURIComponent(c)}` : ""}${rest}${location.hash}`);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/galleries"></noscript>
</head>
<body><a href="/galleries">Galleries</a></body>
</html>
